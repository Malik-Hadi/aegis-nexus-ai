# Default:            docker compose -f deploy/docker-compose.yml --env-file .env up -d
#                     -> PostgreSQL only (what the local-process workflow and scripts use).
# Full one-command:   docker compose -f deploy/docker-compose.yml --env-file .env --profile full up -d --build --wait
#                     -> PostgreSQL + Go API + SOC console at http://localhost:3000
#
# The API refuses plain HTTP on non-loopback addresses by design. In the full stack the
# dashboard therefore shares the API container's network namespace (network_mode), so the
# API stays bound to 127.0.0.1 inside it and only the dashboard port is published.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume. Reset with "docker compose ... down -v".
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      API_ADDR: 127.0.0.1:8080
      SESSION_SECRET: ${SESSION_SECRET}
      SOC_ANALYST_URL: ${SOC_ANALYST_URL:-}
      SOC_ANALYST_TOKEN: ${SOC_ANALYST_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"   # SOC console (served by the dashboard container sharing this network)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
    restart: unless-stopped
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_healthy
    environment:
      SOC_API_ORIGIN: http://127.0.0.1:8080
      SOC_PUBLIC_ORIGIN: http://localhost:3000

volumes:
  pgdata:
